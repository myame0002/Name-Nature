<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NameNature アイコンプレビュー</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background: #f0f0f0;
            padding: 2rem;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 2rem;
            color: #333;
        }
        .preview-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }
        .preview-box {
            background: white;
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        .preview-box h3 {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 1rem;
            text-align: center;
        }
        .screen {
            width: 100%;
            aspect-ratio: 9 / 19.5;
            background: white;
            border-radius: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            border: 3px solid #222;
            box-shadow: inset 0 0 0 2px #111;
        }
        .screen.dark {
            background: white;
        }
        .icon-preview {
            transition: width 0.2s ease;
        }
        .app-icon {
            border-radius: 22%;
            overflow: hidden;
            width: 120px;
            height: 120px;
            background: white;
            margin: 0 auto;
            position: relative;
        }
        .app-icon .safe-zone {
            position: absolute;
            inset: 18%;
            border: 2px dashed rgba(255, 0, 0, 0.5);
            border-radius: 20%;
            pointer-events: none;
        }
        .app-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .controls {
            background: white;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            margin-bottom: 2rem;
        }
        .control-group {
            margin-bottom: 1.5rem;
        }
        .control-group:last-child {
            margin-bottom: 0;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #444;
        }
        input[type="range"] {
            width: 100%;
            margin: 0.5rem 0;
        }
        .value-display {
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: #2563eb;
            margin-top: 0.5rem;
        }
        .copy-value {
            background: #2563eb;
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 1rem;
        }
        .copy-value:hover {
            background: #1d4ed8;
        }
        .note {
            background: #fffbeb;
            padding: 1rem;
            border-radius: 8px;
            border-left: 4px solid #f59e0b;
            margin-top: 2rem;
        }
    </style>
</head>
<body>
    <h1>🔍 アプリアイコン プレビュー</h1>

        <div class="controls">
            <div class="control-group">
                <label>📱 スプラッシュスクリーン アイコンサイズ</label>
                <input type="range" id="splashSize" min="100" max="280" value="200" step="5">
                <div class="value-display" id="splashValue">現在: 200px</div>
            </div>
            
            <div class="control-group">
                <label>🔴 安全領域 赤線の大きさ</label>
                <input type="range" id="safeZoneSize" min="10" max="35" value="18" step="1">
                <div class="value-display" id="safeZoneValue">現在: 18% (標準)</div>
            </div>
            
            <button class="copy-value" onclick="copySplashValue()">✅ この値を app.json に設定する</button>
        </div>

    <div class="preview-container">
        <div class="preview-box">
            <h3>起動画面 プレビュー</h3>
            <div class="screen">
                <img id="splashIcon" src="./assets/images/icon.png" style="width: 200px;" class="icon-preview" alt="アイコン">
            </div>
        </div>

        <div class="preview-box">
            <h3>ホーム画面 アイコン</h3>
            <div class="app-icon">
                <img src="./assets/images/icon_home.png" alt="アイコン">
                <div class="safe-zone"></div>
            </div>
            <p style="text-align: center; margin-top: 0.8rem; font-size: 0.8rem; color: #666;">
                ✖️ 赤い点線より外側は見切れます
            </p>
        </div>
    </div>

    <div class="note">
        <strong>💡 ポイント</strong>
        <ul style="margin: 0.8rem 0 0 1.5rem; line-height: 1.8;">
            <li>アプリアイコンは OS によって自動的に 20% ほどトリミングされます</li>
            <li>ロゴなど重要な要素は赤い点線の内側に入れてください</li>
            <li>スライダーで調整して、丁度良い大きさを見つけてください</li>
            <li>気に入ったサイズになったらボタンを押して app.json に自動反映出来ます</li>
        </ul>
    </div>

    <script>
        const splashSlider = document.getElementById('splashSize');
        const splashIcon = document.getElementById('splashIcon');
        const splashValue = document.getElementById('splashValue');
        
        const safeZoneSlider = document.getElementById('safeZoneSize');
        const safeZoneElement = document.querySelector('.safe-zone');
        const safeZoneValue = document.getElementById('safeZoneValue');

        splashSlider.addEventListener('input', (e) => {
            const size = e.target.value;
            splashIcon.style.width = size + 'px';
            splashValue.textContent = `現在: ${size}px`;
        });
        
        safeZoneSlider.addEventListener('input', (e) => {
            const percent = e.target.value;
            safeZoneElement.style.inset = percent + '%';
            safeZoneValue.textContent = `現在: ${percent}%`;
        });

        function copySplashValue() {
            const size = splashSlider.value;
            
            // VS Code で app.json の該当行を開く
            fetch(`/vscode/cmd?cmd=code --goto app.json:37:0`).catch(() => {});
            
            alert(`✅ 次の値を app.json 37行目に設定してください:\n\n"imageWidth": ${size},`);
        }
    </script>
</body>
</html>
